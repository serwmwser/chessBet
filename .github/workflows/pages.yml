name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chess-bet/web/package-lock.json
      - run: npm install
        working-directory: chess-bet/web
      - run: npm run build
        working-directory: chess-bet/web
        env:
          GITHUB_PAGES: "1"
          NEXT_PUBLIC_BASE_PATH: /chessBet
          NEXT_PUBLIC_THIRDWEB_CLIENT_ID: fc1b95eb7453e110e8e2007b00301f0e
          NEXT_PUBLIC_CHAIN_ID: "137"
          NEXT_PUBLIC_RPC_URL: "https://polygon-bor-rpc.publicnode.com"
          NEXT_PUBLIC_ESCROW: "0xaf8714656261dc770A41857706FF4b2f495e92e9"
          NEXT_PUBLIC_API_URL: "https://84-200-80-66.sslip.io"
          NEXT_PUBLIC_WS_URL: "wss://84-200-80-66.sslip.io/ws"
          NEXT_PUBLIC_BET_MAX_USDC: "500"
          NEXT_PUBLIC_REFERRAL: "1"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: chess-bet/web/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
