<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Проверка микрофона</title>
<style>
  body { font-family: sans-serif; background: #0b1b24; color: #fff; padding: 16px; font-size: 18px; }
  button { font-size: 22px; padding: 16px 24px; border: 0; border-radius: 12px; background: #3fb950; color: #000; width: 100%; }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 16px; line-height: 1.5; }
</style>
</head>
<body>
<h2>Проверка микрофона</h2>
<p>Нажмите кнопку и ГРОМКО говорите всё время, пока идёт проверка (около 15 секунд).</p>
<button id="go">Проверить микрофон</button>
<pre id="log"></pre>
<script>
var logEl = document.getElementById("log");
function log(s) { logEl.textContent += s + "\n"; }
function errTxt(e) { return (e && e.name ? e.name : "?") + (e && e.message ? " — " + e.message : ""); }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

// Измеряет громкость 2 секунды через AudioContext и размер записи MediaRecorder
async function probe(title, constraints) {
  var st;
  try {
    st = await navigator.mediaDevices.getUserMedia({ audio: constraints });
  } catch (e) {
    log(title + ": ОШИБКА " + errTxt(e));
    return;
  }
  var peak = 0, size = 0;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    var ctx = new AC();
    var src = ctx.createMediaStreamSource(st);
    var an = ctx.createAnalyser();
    an.fftSize = 1024;
    src.connect(an);
    var buf = new Uint8Array(an.fftSize);
    var chunks = [];
    var rec = new MediaRecorder(st);
    rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
    rec.start();
    var t0 = Date.now();
    while (Date.now() - t0 < 2000) {
      an.getByteTimeDomainData(buf);
      for (var i = 0; i < buf.length; i++) { var v = Math.abs(buf[i] - 128); if (v > peak) peak = v; }
      await wait(50);
    }
    await new Promise(function (res) { rec.onstop = res; rec.stop(); });
    size = chunks.reduce(function (a, b) { return a + b.size; }, 0);
    try { await ctx.close(); } catch (e) {}
  } catch (e) {
    log(title + ": сбой измерения " + errTxt(e));
  }
  st.getTracks().forEach(function (t) { t.stop(); });
  log(title + ": пик громкости " + peak + " из 128, размер записи " + size + " байт" + (peak > 3 ? "  <-- ЗВУК ЕСТЬ" : "  (тишина)"));
  await wait(400);
}

document.getElementById("go").onclick = async function () {
  logEl.textContent = "";
  log("Браузер: " + navigator.userAgent);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { log("НЕТ mediaDevices (нужен https)"); return; }
  await probe("A. обычный (audio:true)", true);
  await probe("B. без обработки звука", { echoCancellation: false, noiseSuppression: false, autoGainControl: false });
  await probe("C. только без эхоподавления", { echoCancellation: false });
  await probe("D. только без шумоподавления", { noiseSuppression: false });
  await probe("E. 1 канал, 48000 Гц", { channelCount: 1, sampleRate: 48000 });
  try {
    var devs = (await navigator.mediaDevices.enumerateDevices()).filter(function (d) { return d.kind === "audioinput"; });
    for (var i = 0; i < devs.length; i++) {
      await probe("F" + (i + 1) + ". вход «" + (devs[i].label || devs[i].deviceId.slice(0, 8)) + "»", { deviceId: { exact: devs[i].deviceId } });
    }
  } catch (e) { log("Список входов недоступен: " + errTxt(e)); }
  log("ГОТОВО. Пришлите скриншот всего текста.");
};
</script>
</body>
</html>
